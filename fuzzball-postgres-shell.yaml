version: v4

# Maintenance workflow: the PostgreSQL service of fuzzball.yaml on the same
# persistent volume, plus one idle job to open a psql shell in.
#
# Do not run this workflow at the same time as fuzzball.yaml. Two PostgreSQL
# servers on one data directory corrupt the databases, and the lock file does
# not protect a data directory on NFS across two nodes.

volumes:
  postgres-data:
    use: team8
    name: postgres-data-v2

jobs:
  # Open a shell with:
  #   fuzzball workflow exec --tty WORKFLOW postgres-shell -- /bin/bash
  # Inside the shell, `psql` connects to the service as the postgres superuser.
  postgres-shell:
    image: &postgres-image
      uri: docker://docker.io/pgvector/pgvector:pg17
    env:
      - HOME=/tmp
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=postgres
      - PGDATABASE=postgres
      - PGPASSWORD=secret://user/chi-ciq-postgres-password
    mounts: &postgres-data-mount
      /var/lib/postgresql/data:
        volume: postgres-data
    resource:
      cpu:
        cores: 1
      memory:
        size: 1GiB
    policy:
      timeout:
        execute: 48h
    depends-on:
      - {name: postgres, status: RUNNING}
    command: [sleep, infinity]

services:
  postgres:
    image: *postgres-image
    env:
      - POSTGRES_PASSWORD=secret://user/chi-ciq-postgres-password
      - PGDATA=/var/lib/postgresql/data/pgdata
    mounts: *postgres-data-mount
    resource:
      cpu:
        cores: 4
      memory:
        size: 8GiB
    command: [docker-entrypoint.sh, postgres]
    persist: true
    network:
      ports:
        - {name: postgres, port: 5432, protocol: tcp}
    readiness-probe:
      exec:
        command: [pg_isready, --host, 127.0.0.1, --port, "5432", --username, postgres]
      initial-delay-seconds: 5
      period-seconds: 10
      timeout-seconds: 5
      failure-threshold: 12
