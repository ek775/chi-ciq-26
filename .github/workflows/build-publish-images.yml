name: Build and publish Fuzzball images

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - src/**
      - src/**/Dockerfile
      - .github/workflows/build-publish-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: meetings
            dockerfile: src/databases/meetings/Dockerfile
          - name: documents-db
            dockerfile: src/databases/documents/Dockerfile
          - name: analytics-db
            dockerfile: src/databases/analytics/Dockerfile
          - name: transcription
            dockerfile: src/pipelines/transcription/Dockerfile
          - name: documents
            dockerfile: src/pipelines/documents/Dockerfile
          - name: alderman-tracker
            dockerfile: src/pipelines/tracker/Dockerfile
          - name: analytics
            dockerfile: src/pipelines/analytics/Dockerfile
          - name: web
            dockerfile: src/web/Dockerfile

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=raw,value=fuzzball,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-

      - name: Build and publish ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-arm64
