# Architecture notes, not an executable Fuzzfile or validated cluster schema.
# The Fuzzball CLI reports shared/datasets as external NFS. Its file listing
# was not verified. team8/volume_test was inspected on 2026-11-14.
status: draft

cluster:
  volumes:
    datasets:
      reference: shared/datasets
      provisioner: shared
      backend: nfs
      persistent: true
      metadata-reported-size-bytes: 0
      mount-path: /datasets
      purpose: staged-inputs-and-append-only-database-archives
    volume-test:
      reference: team8/volume_test
      persistent: true
      metadata-reported-size-bytes: 0
      purpose: audio-recordings-for-transcription

data:
  volume-content: shared-datasets-not-verified-team8-audio-inspected
  required-layout:
    recordings: /volume/audio
    transcripts: /datasets/Transcripts
    database-archives: /datasets/database
    analytics-inputs: /datasets/analytics
  repository-snapshot:
    transcripts:
      source: data-reference/Transcripts
      files: 202
      unique-content-hashes: 193
      ingest: documents
    recordings:
      source: data/mp4
      files: 1
      size-bytes: 1723634501
      duration-seconds: 32949.4
      streams: [h264-video-426x240, aac-audio-48000hz]
      ingest: transcription
    captions:
      source: data/vtt
      files: 1
      ingest: excluded-webvtt-is-not-supported-by-the-document-extractor
    database-archives:
      source: data/database
      files: 2
      ingest: excluded-backups-are-not-restored-or-used-as-live-inputs

logging:
  python: json-on-stderr-via-shared.logging
  environment: [LOG_LEVEL, LOG_SERVICE_NAME]
  collection: host-runs-bash-scripts/logs.sh-WORKFLOW-JOB
  destination: data/logs/WORKFLOW/JOB.log-on-submitter
  upstream-containers: native-stdout-stderr-via-fuzzball-workflow-log
  lifecycle: collect-before-workflow-deletion-or-cluster-log-expiry

pipelines:
  downloads:
    source: src/pipelines/downloads
    dockerfile: src/pipelines/downloads/Dockerfile
    command: [chi-ciq-download-vimeo, --output-dir, /datasets/mp4]
    volume:
      reference: shared/datasets
      mount-path: /datasets
      access: read-write
    network: public-vimeo-and-cdn-egress
    concurrency: one-downloader-writer-per-dataset-volume
    handoff: validated-complete-mp4s-in-/datasets/mp4
  transcription:
    source: src/pipelines/transcription
    dockerfile: src/pipelines/transcription/Dockerfile
    command: [chi-ciq-ingest, --input-dir, /volume/audio, --namespace, recordings, --metadata-file, /inputs/metadata.json]
    volume:
      reference: team8/volume_test
      mount-path: /volume
      access: read-only
    metadata: separately-mounted-reviewed-id-to-dated-filename-json
    database-secret: DATABASE_URL
    inference-secret: HF_TOKEN
    resources: one-gpu
    execution: one-batch-worker-processes-discovered-recordings-sequentially
    job-timeout: set-from-measured-runtime-for-recordings
    network: model-download-egress-and-private-meetings-database
  documents:
    source: src/pipelines/documents
    dockerfile: src/pipelines/documents/Dockerfile
    command:
      [chi-ciq-ingest-documents, --input-dir, /datasets/Transcripts, --namespace, transcripts]
    volume:
      reference: shared/datasets
      mount-path: /datasets
      access: read-only
    database-secret: DOCUMENTS_DATABASE_URL
    input-format: utf8-txt-only-for-current-corpus
    inference: local-text-embeddings-cpu-default
    network: model-download-egress-and-private-documents-database
  analytics:
    source: src/pipelines/analytics
    dockerfile: src/pipelines/analytics/Dockerfile
    command: [chi-ciq-analytics, run]
    setup-commands:
      # Optional overrides; the run's roster stage seeds current officials.
      - [chi-ciq-analytics, roster, /datasets/analytics/roster.csv]
      - [chi-ciq-analytics, label-speakers, /datasets/analytics/speaker-labels.csv]
    volume:
      reference: shared/datasets
      mount-path: /datasets
      access: read-only
    database-secrets: [ANALYTICS_DATABASE_URL, MEETINGS_DATABASE_URL, DOCUMENTS_DATABASE_URL]
    source-access: read-only-select-on-meetings-and-documents
    inference: local-sentiment-emotion-and-text-embeddings-cpu-default
    stance-endpoint: VLLM_BASE_URL-openai-compatible-structured-output
    network: model-download-and-data.cityofchicago.org-egress-private-databases-and-vllm

databases:
  meetings:
    management: external-to-these-pipelines
    connection-secret: DATABASE_URL
    migration: [chi-ciq-database, migrate]
    backup: [chi-ciq-database, backup, --output-dir, /datasets/database/meetings]
  documents:
    management: external-to-these-pipelines
    connection-secret: DOCUMENTS_DATABASE_URL
    migration: [chi-ciq-documents-database, migrate]
    backup:
      [chi-ciq-documents-database, backup, --output-dir, /datasets/database/documents]
  analytics:
    management: external-to-these-pipelines
    connection-secret: ANALYTICS_DATABASE_URL
    migration: [chi-ciq-analytics-database, migrate]
    dashboard-role: analytics_reader-via-src/databases/analytics/web-role.sql
    backup:
      [chi-ciq-analytics-database, backup, --output-dir, /datasets/database/analytics]

workflows:
  initial-meetings-build:
    requires: completed-recordings-under-/volume/audio-and-reviewed-metadata
    stages: [migrate-meetings, ingest-mounted-recordings, backup-meetings]
  periodic-meetings-update:
    schedule: external-scheduler-to-be-configured
    requires: completed-recordings-under-/volume/audio-and-reviewed-metadata
    stages:
      [migrate-meetings, ingest-mounted-recordings, backup-meetings]
    semantics: skip-unchanged-and-atomically-publish-successful-replacements
  initial-documents-build:
    requires: staged-transcripts-under-/datasets/Transcripts
    stages: [migrate-documents, ingest-transcript-tree, backup-documents]
  periodic-documents-update:
    schedule: external-scheduler-to-be-configured
    stages: [ingest-transcript-tree, backup-documents]
    semantics: skip-unchanged-atomically-replace-files-retain-removed-files-and-directories
  periodic-analytics-update:
    schedule: after-meetings-and-documents-updates
    requires: speaker-labels-under-/datasets/analytics-and-reachable-vllm
    stages: [migrate-analytics, run-analytics, backup-analytics]
    semantics: resync-changed-sources-skip-current-model-results-refresh-dashboard-views

constraints:
  - Stage repository inputs into shared/datasets before starting workers; submitter-local paths are not worker paths.
  - Mount inputs read-only in ingestion jobs; only downloads and backup jobs write to the dataset volume.
  - Confirm shared NFS supports the POSIX locks and atomic rename required by downloads and backups.
  - Wait for audio downloads to finish and review Vimeo metadata before transcription.
  - Set transcription job timeout from measured recording runtimes; do not assume the default job lifetime is sufficient.
  - Never restore database archives or overwrite a live database during pipeline updates.
  - Keep database connection credentials in cluster secrets, not this file.
  - Do not submit until volume contents, database endpoints, secrets, registry images, and Fuzzball schema are confirmed.
