jobs:
  download:
    image:
      uri: docker://docker.io/library/python:3.12-slim-trixie
    mounts:
      /data:
        volume: team
    policy:
      timeout:
        execute: 8m
    resource:
      cpu:
        cores: 2
      memory:
        size: 1GiB
    script: |
      #!/bin/sh
      set -eu
      mkdir -p /data/audio
      tmp=$(mktemp -d)
      trap 'rm -rf "$tmp"' EXIT
      export PATH="$tmp/venv/bin:$PATH"
      python -m venv "$tmp/venv"
      cp -r /data/chi-ciq-26-163dd1c7be39e9b8823a96396b8b31c48dddef81 "$tmp/repo"
      pip -q install "$tmp/repo[downloads]"
      case "$(uname -m)" in aarch64) arch=arm64;; x86_64) arch=amd64;; esac
      python -c 'import sys,urllib.request; urllib.request.urlretrieve("https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-"+sys.argv[1]+"-static.tar.xz",sys.argv[2])' "$arch" "$tmp/ffmpeg.tar.xz"
      python -c 'import sys,tarfile; a=tarfile.open(sys.argv[1]); a.extractall(sys.argv[2],members=[m for m in a if m.isfile() and m.name.rsplit("/",1)[-1] in ("ffmpeg","ffprobe")],filter="data")' "$tmp/ffmpeg.tar.xz" "$tmp"
      export PATH="$(dirname "$(find "$tmp" -name ffprobe -type f | head -1)"):$PATH"
      chi-ciq-download-vimeo --audio-only --workers 1 --output-dir /data/audio 1135569237
      cat /data/audio/.vimeo/1135569237.json
version: v4
volumes:
  team:
    name: volume_test
    use: team8
