version: v4

defaults:
  job:
    env:
      - LOG_LEVEL=secret://user/chi-ciq-log-level
      - HOME=/tmp
      # The database URLs carry no password: libpq reads it from PGPASSWORD.
      - PGPASSWORD=secret://user/chi-ciq-postgres-password
    policy:
      timeout:
        execute: 48h

volumes:
  datasets:
    use: shared
    name: datasets
  recordings:
    use: team8
    name: volume_test
  postgres-data:
    use: team8
    name: postgres-data-v2
  database-backups:
    use: team8
    name: database-backups
  vllm-model-cache:
    use: team8
    name: vllm-model-data

jobs:
  # Idempotent: creates the three databases and the read-only roles. The
  # default privileges give each reader SELECT on tables that the migrations
  # create later. analytics_reader gets its grants from the analytics migration.
  postgres-provision:
    image: &postgres-image
      uri: docker://docker.io/pgvector/pgvector:pg17
    resource: &small
      cpu:
        cores: 1
      memory:
        size: 1GiB
    depends-on:
      - {name: postgres, status: RUNNING}
    script: |
      #!/bin/sh
      set -eu
      psql --host=postgres --port=5432 --username=postgres --dbname=postgres \
        --no-password --set=ON_ERROR_STOP=1 <<'SQL'
      \getenv reader_password PGPASSWORD
      SELECT format('CREATE DATABASE %I', name)
      FROM unnest(ARRAY['meetings', 'documents', 'analytics']) AS name
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = name)
      \gexec
      SELECT format('CREATE ROLE %I', name)
      FROM unnest(ARRAY['web_reader', 'documents_reader', 'analytics_reader']) AS name
      WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = name)
      \gexec
      SELECT format(
        'ALTER ROLE %I WITH LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS',
        name, :'reader_password')
      FROM unnest(ARRAY['web_reader', 'documents_reader', 'analytics_reader']) AS name
      \gexec
      \connect meetings
      GRANT SELECT ON ALL TABLES IN SCHEMA public TO web_reader;
      ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
        GRANT SELECT ON TABLES TO web_reader;
      \connect documents
      GRANT SELECT ON ALL TABLES IN SCHEMA public TO documents_reader;
      ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
        GRANT SELECT ON TABLES TO documents_reader;
      SQL

  documents-backup-before:
    image: &documents-db-image
      uri: docker://ghcr.io/ek775/chi-ciq-26-documents-db:fuzzball
    env: &documents-env
      - DOCUMENTS_DATABASE_URL=postgresql+psycopg://postgres@postgres:5432/documents
    mounts: &archive-mount
      /backups:
        volume: database-backups
    resource: *small
    depends-on: &database-provisioned
      - {name: postgres-provision, status: FINISHED}
    command: [chi-ciq-documents-database, backup, --output-dir, /backups/documents]

  analytics-backup-before:
    image: &analytics-db-image
      uri: docker://ghcr.io/ek775/chi-ciq-26-analytics-db:fuzzball
    env: &analytics-db-env
      - ANALYTICS_DATABASE_URL=postgresql+psycopg://postgres@postgres:5432/analytics
    mounts: *archive-mount
    resource: *small
    depends-on: *database-provisioned
    command: [chi-ciq-analytics-database, backup, --output-dir, /backups/analytics]

  meetings-migrate:
    image:
      uri: docker://ghcr.io/ek775/chi-ciq-26-meetings:fuzzball
    env:
      - DATABASE_URL=postgresql+psycopg://postgres@postgres:5432/meetings
    resource: *small
    depends-on: *database-provisioned
    command: [chi-ciq-database, migrate]

  documents-migrate:
    image: *documents-db-image
    env: *documents-env
    resource: *small
    depends-on:
      - {name: documents-backup-before, status: FINISHED}
    command: [chi-ciq-documents-database, migrate]

  analytics-migrate:
    image: *analytics-db-image
    env: *analytics-db-env
    resource: *small
    depends-on:
      - {name: analytics-backup-before, status: FINISHED}
    command: [chi-ciq-analytics-database, migrate]

  transcription:
    image:
      uri: docker://ghcr.io/ek775/chi-ciq-26-transcription:fuzzball
    env:
      - POSTGRES_PASSWORD=secret://user/chi-ciq-postgres-password
      - DATABASE_URL=postgresql+psycopg://postgres@postgres:5432/meetings
      - HF_TOKEN=secret://user/chi-ciq-hf-token
      - SHARD_COUNT=128
      - AUDIO_MEETING_MAP=/datasets/audio-meeting-map.json
    mounts:
      /volume:
        volume: recordings
      /datasets:
        volume: datasets
    resource:
      cpu:
        cores: 8
      memory:
        size: 64GiB
      devices:
        nvidia.com/gpu: 1
    task-array:
      start: 1
      end: 128
      concurrency: 2
    depends-on:
      - {name: meetings-migrate, status: FINISHED}
    script: |
      #!/bin/sh
      set -eu
      test -f "$AUDIO_MEETING_MAP"
      exec chi-ciq-ingest --input-dir /volume/audio \
        --audio-meeting-map "$AUDIO_MEETING_MAP" --namespace recordings \
        --shard-index "$((FB_TASK_ID - 1))" --shard-count "$SHARD_COUNT"

  documents:
    image:
      uri: docker://ghcr.io/ek775/chi-ciq-26-documents:fuzzball
    env:
      - POSTGRES_PASSWORD=secret://user/chi-ciq-postgres-password
      - DOCUMENTS_DATABASE_URL=postgresql+psycopg://postgres@postgres:5432/documents
      - SHARD_COUNT=4
    mounts:
      /volume:
        volume: recordings
    resource: &inference
      cpu:
        cores: 4
      memory:
        size: 8GiB
    task-array:
      start: 1
      end: 4
      concurrency: 4
    depends-on:
      - {name: documents-migrate, status: FINISHED}
    script: |
      #!/bin/sh
      set -eu
      archive=/volume/chicago-city-council-archive
      test -d "$archive/Meetings"
      test -f "$archive/index.json"
      exec chi-ciq-ingest-documents --input-dir "$archive/Meetings" \
        --namespace transcripts --device cpu \
        --shard-index "$((FB_TASK_ID - 1))" --shard-count "$SHARD_COUNT"

  analytics-sync:
    image: &analytics-image
      uri: docker://ghcr.io/ek775/chi-ciq-26-analytics:fuzzball
    env: &analytics-env
      - ANALYTICS_DATABASE_URL=postgresql+psycopg://postgres@postgres:5432/analytics
      - MEETINGS_DATABASE_URL=postgresql+psycopg://web_reader@postgres:5432/meetings
      - DOCUMENTS_DATABASE_URL=postgresql+psycopg://documents_reader@postgres:5432/documents
      - VLLM_BASE_URL=http://vllm:8000/v1
      - VLLM_SERVED_MODEL=local-ai
      - VLLM_REASONING_EFFORT=secret://user/chi-ciq-vllm-reasoning-effort
      - VLLM_REASONING_TOKENS=secret://user/chi-ciq-vllm-reasoning-tokens
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
    resource: *inference
    depends-on:
      - {name: analytics-migrate, status: FINISHED}
      - {name: transcription, status: FINISHED}
      - {name: documents, status: FINISHED}
    command: [chi-ciq-analytics, run, --stages, sync]

  analytics-roster:
    image: *analytics-image
    env: *analytics-env
    mounts:
      /datasets:
        volume: datasets
    resource: *inference
    depends-on:
      - {name: analytics-sync, status: FINISHED}
    script: |
      #!/bin/sh
      set -eu
      chi-ciq-analytics run --stages roster
      if [ -f /datasets/analytics/roster.csv ]; then
        chi-ciq-analytics roster /datasets/analytics/roster.csv
      fi
      if [ -f /datasets/analytics/speaker-labels.csv ]; then
        chi-ciq-analytics label-speakers /datasets/analytics/speaker-labels.csv
      fi

  analytics-attribute:
    image: *analytics-image
    env: *analytics-env
    resource: *inference
    depends-on: &analysis-deps
      - {name: analytics-roster, status: FINISHED}
    command: [chi-ciq-analytics, run, --stages, attribute, --parallel-stage]

  analytics-mentions:
    image: *analytics-image
    env: *analytics-env
    resource: *inference
    depends-on: *analysis-deps
    command: [chi-ciq-analytics, run, --stages, mentions, --parallel-stage]

  analytics-sentiment:
    image: *analytics-image
    env: *analytics-env
    resource: &classifier-resource
      cpu:
        cores: 2
      memory:
        size: 8GiB
    task-array: &classifier-array
      start: 1
      end: 32
      concurrency: 4
    depends-on: *analysis-deps
    script: |
      #!/bin/sh
      set -eu
      exec chi-ciq-analytics run --stages sentiment --parallel-stage --device cpu \
        --shard-index "$((FB_TASK_ID - 1))" --shard-count 32

  analytics-emotion:
    image: *analytics-image
    env: *analytics-env
    resource: *classifier-resource
    task-array: *classifier-array
    depends-on: *analysis-deps
    script: |
      #!/bin/sh
      set -eu
      exec chi-ciq-analytics run --stages emotion --parallel-stage --device cpu \
        --shard-index "$((FB_TASK_ID - 1))" --shard-count 32

  analytics-topics:
    image: *analytics-image
    env: *analytics-env
    resource: *inference
    depends-on: *analysis-deps
    command: [chi-ciq-analytics, run, --stages, topics, --parallel-stage, --device, cpu]

  analytics-stance:
    image: *analytics-image
    env: *analytics-env
    resource:
      cpu:
        cores: 1
      memory:
        size: 2GiB
    task-array: *classifier-array
    depends-on:
      - {name: analytics-topics, status: FINISHED}
      - {name: analytics-attribute, status: FINISHED}
      - {name: vllm, status: RUNNING}
    script: |
      #!/bin/sh
      set -eu
      exec chi-ciq-analytics run --stages stance --parallel-stage \
        --shard-index "$((FB_TASK_ID - 1))" --shard-count 32 \
        --stance-concurrency 2

  analytics-refresh:
    image: *analytics-image
    env: *analytics-env
    resource: *small
    depends-on:
      - {name: analytics-attribute, status: FINISHED}
      - {name: analytics-mentions, status: FINISHED}
      - {name: analytics-sentiment, status: FINISHED}
      - {name: analytics-emotion, status: FINISHED}
      - {name: analytics-topics, status: FINISHED}
      - {name: analytics-stance, status: FINISHED}
    command: [chi-ciq-analytics, run, --stages, refresh]

  documents-backup-after:
    image: *documents-db-image
    env: *documents-env
    mounts: *archive-mount
    resource: *small
    depends-on:
      - {name: documents, status: FINISHED}
    command: [chi-ciq-documents-database, backup, --output-dir, /backups/documents]

  analytics-backup-after:
    image: *analytics-db-image
    env: *analytics-db-env
    mounts: *archive-mount
    resource: *small
    depends-on:
      - {name: analytics-refresh, status: FINISHED}
    command: [chi-ciq-analytics-database, backup, --output-dir, /backups/analytics]

  web-check:
    image: &web-image
      uri: docker://ghcr.io/ek775/chi-ciq-26-web:fuzzball
    env: &web-env
      - DATABASE_URL=postgresql+psycopg://web_reader@postgres:5432/meetings
      - ANALYTICS_DATABASE_URL=postgresql+psycopg://analytics_reader@postgres:5432/analytics
      - PGPASSWORD=secret://user/chi-ciq-postgres-password
      - LOG_LEVEL=secret://user/chi-ciq-log-level
      - HOME=/tmp
    resource: *small
    depends-on:
      - {name: transcription, status: FINISHED}
      - {name: documents-backup-after, status: FINISHED}
      - {name: analytics-backup-after, status: FINISHED}
    script: |
      #!/bin/sh
      set -eu
      chi-ciq-database check
      chi-ciq-analytics-database check
      python - <<'PY'
      import os
      from sqlalchemy import text
      from databases.meetings.schema import connect_database
      from databases.analytics.views import DASHBOARD_OBJECTS
      for variable, tables in (
          ("DATABASE_URL", ("meetings", "published_sources", "speakers", "transcript_segments")),
          ("ANALYTICS_DATABASE_URL", DASHBOARD_OBJECTS),
      ):
          engine = connect_database(os.environ[variable])
          try:
              with engine.begin() as connection:
                  connection.execute(text("SET TRANSACTION READ ONLY"))
                  for table in tables:
                      connection.execute(text(f"SELECT * FROM {table} LIMIT 0"))
          finally:
              engine.dispose()
      PY

services:
  # Jobs reach the database as postgres:5432. The data directory is on the
  # persistent volume team8/postgres-data and survives workflow teardown.
  postgres:
    image: *postgres-image
    env:
      - POSTGRES_PASSWORD=secret://user/chi-ciq-postgres-password
      # initdb needs a directory it owns, so use a subdirectory of the mount.
      - PGDATA=/var/lib/postgresql/data/pgdata
    mounts:
      /var/lib/postgresql/data:
        volume: postgres-data
    resource:
      cpu:
        cores: 4
      memory:
        size: 8GiB
    command: [docker-entrypoint.sh, postgres]
    persist: true
    network:
      ports:
        - {name: postgres, port: 5432, protocol: tcp}
    readiness-probe:
      # TCP, not the socket: the temporary server of the first-run
      # initialization listens on the socket only, and must not count as ready.
      exec:
        command: [pg_isready, --host, 127.0.0.1, --port, "5432", --username, postgres]
      initial-delay-seconds: 5
      period-seconds: 10
      timeout-seconds: 5
      failure-threshold: 12

  # Start only after both GPU and CPU ingestion have released their inputs.
  # The persistent cache avoids downloading model weights on every workflow run.
  vllm:
    image:
      uri: docker://vllm/vllm-openai:v0.32.0
    env:
      - HF_TOKEN=secret://user/chi-ciq-hf-token
      - VLLM_ENGINE_READY_TIMEOUT_S=3600
    mounts:
      /root/.cache/huggingface:
        volume: vllm-model-cache
    resource:
      cpu:
        cores: 8
      memory:
        size: 64GiB
      devices:
        nvidia.com/gpu: 1
    depends-on:
      - {name: transcription, status: FINISHED}
      - {name: documents, status: FINISHED}
    command:
      - --model
      - openai/gpt-oss-20b
      - --served-model-name
      - local-ai
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "32768"
      - --gpu-memory-utilization
      - "0.9"
      - --tensor-parallel-size
      - "1"
      - --reasoning-parser
      - openai_gpt-oss
    persist: true
    network:
      ports:
        - {name: http, port: 8000, protocol: tcp}
    readiness-probe:
      http-get:
        path: /health
        port: 8000
      initial-delay-seconds: 60
      period-seconds: 30
      timeout-seconds: 10
      failure-threshold: 120

  web:
    image: *web-image
    env: *web-env
    resource:
      cpu:
        cores: 2
      memory:
        size: 2GiB
    depends-on:
      - {name: web-check, status: FINISHED}
    command: [chi-ciq-web]
    persist: true
    network:
      ports:
        - {name: http, port: 8080, protocol: tcp}
      endpoints:
        - name: app
          port-name: http
          protocol: http
          type: subdomain
          scope: user
    readiness-probe:
      http-get:
        path: /ready
        port: 8080
      initial-delay-seconds: 5
      period-seconds: 10
      timeout-seconds: 5
      failure-threshold: 6
