services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: transcription
      POSTGRES_DB: transcription
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcription -d transcription"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    gpus: all
    init: true
    working_dir: /workspace
    volumes:
      - .:/workspace
      - model-cache:/root/.cache
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      TRANSCRIPTION_INPUT_DIR: ${TRANSCRIPTION_INPUT_DIR:-data/mp4}
      TRANSCRIPTION_OUTPUT_DIR: ${TRANSCRIPTION_OUTPUT_DIR:-data/database}
      DATABASE_URL: postgresql+psycopg://transcription:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/transcription
    depends_on:
      db:
        condition: service_healthy
    command: ["sleep", "infinity"]

volumes:
  postgres-data:
  model-cache:
