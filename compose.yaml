services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: transcription
      POSTGRES_DB: transcription
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcription -d transcription"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    gpus: all
    init: true
    working_dir: /workspace
    volumes:
      - .:/workspace
      - model-cache:/root/.cache
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATABASE_URL: postgresql+psycopg://transcription@db:5432/transcription
    depends_on:
      db:
        condition: service_healthy
    command: ["sleep", "infinity"]
  meetings-migrate:
    profiles: ["pipelines", "web"]
    build:
      context: .
      dockerfile: src/databases/meetings/Dockerfile
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATABASE_URL: postgresql+psycopg://transcription@db:5432/transcription
    depends_on:
      db:
        condition: service_healthy
    command: ["chi-ciq-database", "migrate"]
  meetings-web-role:
    image: pgvector/pgvector:pg17
    profiles: ["web"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./src/web/web-role.sql:/web-role.sql:ro
    depends_on:
      meetings-migrate:
        condition: service_completed_successfully
    command:
      - psql
      - --host=db
      - --username=transcription
      - --dbname=transcription
      - --file=/web-role.sql
  transcription:
    profiles: ["pipelines"]
    build:
      context: .
      dockerfile: src/pipelines/transcription/Dockerfile
    gpus: all
    init: true
    volumes:
      - ./data/mp4:/inputs:ro
      - model-cache:/root/.cache
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATABASE_URL: postgresql+psycopg://transcription@db:5432/transcription
    depends_on:
      meetings-migrate:
        condition: service_completed_successfully
  downloads:
    profiles: ["downloads"]
    build:
      context: .
      dockerfile: src/pipelines/downloads/Dockerfile
    init: true
    volumes:
      - ./data/mp4:/outputs
  documents-db:
    profiles: ["documents"]
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: documents
      POSTGRES_DB: documents
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - documents-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documents -d documents"]
      interval: 5s
      timeout: 5s
      retries: 10
  documents-migrate:
    profiles: ["documents"]
    build:
      context: .
      dockerfile: src/databases/documents/Dockerfile
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DOCUMENTS_DATABASE_URL: postgresql+psycopg://documents@documents-db:5432/documents
    depends_on:
      documents-db:
        condition: service_healthy
    command: ["chi-ciq-documents-database", "migrate"]
  documents:
    profiles: ["documents"]
    build:
      context: .
      dockerfile: src/pipelines/documents/Dockerfile
    init: true
    volumes:
      - ${DOCUMENTS_INPUT_DIR:-./data-reference}:/inputs:ro
      - documents-model-cache:/root/.cache
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DOCUMENTS_DATABASE_URL: postgresql+psycopg://documents@documents-db:5432/documents
    depends_on:
      documents-migrate:
        condition: service_completed_successfully
  documents-backup:
    profiles: ["documents"]
    build:
      context: .
      dockerfile: src/databases/documents/Dockerfile
    volumes:
      - ./data/documents-database:/backups
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DOCUMENTS_DATABASE_URL: postgresql+psycopg://documents@documents-db:5432/documents
    depends_on:
      documents-db:
        condition: service_healthy
    command: ["chi-ciq-documents-database", "backup", "--output-dir", "/backups"]
  meetings-backup:
    profiles: ["pipelines"]
    build:
      context: .
      dockerfile: src/databases/meetings/Dockerfile
    volumes:
      - ./data/database:/backups
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATABASE_URL: postgresql+psycopg://transcription@db:5432/transcription
    depends_on:
      db:
        condition: service_healthy
    command: ["chi-ciq-database", "backup", "--output-dir", "/backups"]
  analytics-db:
    profiles: ["analytics", "web"]
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: analytics
      POSTGRES_DB: analytics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - analytics-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 10
  analytics-migrate:
    profiles: ["analytics", "web"]
    build:
      context: .
      dockerfile: src/databases/analytics/Dockerfile
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ANALYTICS_DATABASE_URL: postgresql+psycopg://analytics@analytics-db:5432/analytics
    depends_on:
      analytics-db:
        condition: service_healthy
    command: ["chi-ciq-analytics-database", "migrate"]
  analytics-web-role:
    image: pgvector/pgvector:pg17
    profiles: ["analytics", "web"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./src/databases/analytics/web-role.sql:/web-role.sql:ro
    depends_on:
      analytics-migrate:
        condition: service_completed_successfully
    command:
      - psql
      - --host=analytics-db
      - --username=analytics
      - --dbname=analytics
      - --set=ON_ERROR_STOP=1
      - --file=/web-role.sql
  analytics:
    profiles: ["analytics"]
    build:
      context: .
      dockerfile: src/pipelines/analytics/Dockerfile
    init: true
    volumes:
      - ./data/analytics:/inputs:ro
      - analytics-model-cache:/root/.cache
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ANALYTICS_DATABASE_URL: postgresql+psycopg://analytics@analytics-db:5432/analytics
      # Sources are read-only inputs; meetings use the SELECT-only web role.
      MEETINGS_DATABASE_URL: postgresql+psycopg://web_reader@db:5432/transcription
      DOCUMENTS_DATABASE_URL: postgresql+psycopg://documents_reader@documents-db:5432/documents
    depends_on:
      analytics-web-role:
        condition: service_completed_successfully
    command:
      - chi-ciq-analytics
      - run
      - --vllm-url
      - http://vllm:8000/v1
  analytics-backup:
    profiles: ["analytics"]
    build:
      context: .
      dockerfile: src/databases/analytics/Dockerfile
    volumes:
      - ./data/analytics-database:/backups
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ANALYTICS_DATABASE_URL: postgresql+psycopg://analytics@analytics-db:5432/analytics
    depends_on:
      analytics-db:
        condition: service_healthy
    command: ["chi-ciq-analytics-database", "backup", "--output-dir", "/backups"]
  web:
    profiles: ["web"]
    build:
      context: .
      dockerfile: src/web/Dockerfile
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATABASE_URL: postgresql+psycopg://web_reader@db:5432/transcription
      # Dashboard reads only the granted analytics views and summary tables.
      ANALYTICS_DATABASE_URL: postgresql+psycopg://analytics_reader@analytics-db:5432/analytics
    depends_on:
      meetings-web-role:
        condition: service_completed_successfully
      analytics-web-role:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=5).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
  vllm:
    image: vllm/vllm-openai:v0.32.0
    profiles: ["ai"]
    gpus: all
    init: true
    ipc: host
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - vllm-model-cache:/root/.cache/huggingface
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    command:
      - --model
      - openai/gpt-oss-20b
      - --served-model-name
      - local-ai
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "32768"
      - --gpu-memory-utilization
      - "0.9"
      - --tensor-parallel-size
      - "1"
      - --reasoning-parser
      - openai_gpt-oss
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).close()"
      interval: 30s
      timeout: 10s
      start_period: 60m
      retries: 5

volumes:
  postgres-data:
  documents-postgres-data:
  documents-model-cache:
  analytics-postgres-data:
  analytics-model-cache:
  model-cache:
  vllm-model-cache:
