[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "chi-ciq-transcription"
version = "0.1.0"
description = "Transcript and document ingestion, analytics, PostgreSQL persistence, and web services."
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "python-dotenv",
    "sqlalchemy",
    "psycopg[binary]",
    "pgvector",
]

[project.scripts]
chi-ciq-ingest = "pipelines.transcription.pipeline:main"
chi-ciq-dispatch = "pipelines.transcription.dispatch:main"
chi-ciq-download-vimeo = "pipelines.downloads.vimeo:main"
chi-ciq-vimeo-metadata = "pipelines.downloads.vimeo:metadata_main"
chi-ciq-database = "databases.meetings.schema:main"
chi-ciq-ingest-documents = "pipelines.documents.pipeline:main"
chi-ciq-documents-database = "databases.documents.schema:main"
chi-ciq-analytics = "pipelines.analytics.pipeline:main"
chi-ciq-analytics-database = "databases.analytics.schema:main"
chi-ciq-web = "web.app:main"
chi-ciq-fuzzball-env = "shared.fuzzball_env:main"

[project.optional-dependencies]
deployment = ["PyYAML"]
database = []
downloads = ["yt-dlp"]
web = [
    "fastapi",
    "uvicorn",
]
documents = [
    "sentence-transformers",
    "pypdf",
    "python-docx>=1.2",
    "beautifulsoup4",
]
analytics = [
    # Install CPU or CUDA torch first; stance analysis calls a separate vLLM server.
    "torch",
    "transformers",
    "sentence-transformers",
]
ingestion = [
    "scipy",
    # Hugging Face model loading and inference.
    "huggingface-hub",
    "transformers",
    "accelerate",
    # Whisper transcription and pyannote speaker diarization.
    "openai-whisper",
    "pyannote.audio>=4,<5",
    "torch",
    "torchaudio",
    "torchcodec",
    # Requires system FFmpeg with shared libraries (e.g. apt install ffmpeg).
    "ffmpeg-python",
    # Load HF_TOKEN from .env; gated pyannote models also require accepting terms.
    "sentence-transformers",
    "tqdm",
]
dev = [
    "scipy",
    "pytest",
    "ruff",
    "httpx",
    "PyYAML",
]

[tool.setuptools.package-data]
web = ["static/*"]
"pipelines.downloads" = ["vimeo-ids.txt"]
"pipelines.analytics" = ["taxonomy.json", "chicago_officials.json"]
"databases.analytics" = ["web-role.sql"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pipelines*", "databases*", "web*", "shared*"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]