[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "chi-ciq-transcription"
version = "0.1.0"
description = "Transcript ingestion, PostgreSQL persistence, and web delivery services."
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "python-dotenv",
    "sqlalchemy",
    "psycopg[binary]",
    "pgvector",
]

[project.scripts]
chi-ciq-ingest = "pipelines.transcription.pipeline:main"
chi-ciq-database = "databases.meetings.schema:main"
chi-ciq-web = "web.app:main"

[project.optional-dependencies]
database = []
web = [
    "fastapi",
    "uvicorn",
]
ingestion = [
    "scipy",
    # Hugging Face model loading and inference.
    "huggingface-hub",
    "transformers",
    "accelerate",
    # Whisper transcription and pyannote speaker diarization.
    "openai-whisper",
    "pyannote.audio>=4,<5",
    "torch",
    "torchaudio",
    "torchcodec",
    # Requires system FFmpeg with shared libraries (e.g. apt install ffmpeg).
    "ffmpeg-python",
    # Load HF_TOKEN from .env; gated pyannote models also require accepting terms.
    "sentence-transformers",
    "tqdm",
]
dev = [
    "scipy",
    "pytest",
    "ruff",
    "httpx",
]

[tool.setuptools.package-data]
web = ["static/*"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pipelines*", "databases*", "web*"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]