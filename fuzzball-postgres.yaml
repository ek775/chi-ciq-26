version: v4

# Long-running PostgreSQL service. Runs apart from fuzzball.yaml so that a
# pipeline or web release never replaces the database. The data directory is on
# the persistent volume team8/postgres-data: stop this workflow and start it
# again, and the same databases come back.

volumes:
  postgres-data:
    use: team8
    name: postgres-data

services:
  postgres:
    image:
      uri: docker://docker.io/pgvector/pgvector:pg17
    env:
      - POSTGRES_PASSWORD=secret://user/chi-ciq-postgres-password
      # initdb needs a directory it owns, so use a subdirectory of the mount.
      - PGDATA=/var/lib/postgresql/data/pgdata
    mounts:
      /var/lib/postgresql/data:
        volume: postgres-data
    resource:
      cpu:
        cores: 4
      memory:
        size: 8GiB
    command: [docker-entrypoint.sh, postgres]
    persist: true
    network:
      ports:
        - {name: postgres, port: 5432, protocol: tcp}
    readiness-probe:
      # TCP, not the socket: the temporary server of the first-run
      # initialization listens on the socket only, and must not count as ready.
      exec:
        command: [pg_isready, --host, 127.0.0.1, --port, "5432"]
      initial-delay-seconds: 5
      period-seconds: 10
      timeout-seconds: 5
      failure-threshold: 12
